<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave View</title>
  
  <script>
    const webAppUrl = "https://script.google.com/macros/s/AKfycbzl8BdqoJVL0-LtFIQkUgMmoXXGKvF-Kt4Y6ZwPV73o0Cx7hX8vHYigFtEvMIDF4lVy/exec";

    // 1. ตรวจสอบ iOS (iPhone/iPad) -> ถ้าใช่ให้ Redirect ทันที
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    if (isIOS) {
      window.location.href = webAppUrl;
    }

    // 2. ตัวแปรควบคุมสถานะ
    let isAppLoaded = false;

    // 3. ดักฟัง postMessage จาก Google Apps Script
    window.addEventListener("message", function(event) {
      // เมื่อได้รับข้อความ GAS_LOADED ให้ยกเลิกการ Redirect ทันที
      if (event.data === "GAS_LOADED") {
        isAppLoaded = true;
      }
    }, false);

    // 4. ตัวจับเวลา Fallback (หากผ่านไป 5 วินาทีแล้วยังไม่ได้ข้อความ GAS_LOADED แสดงว่าติด 401)
    setTimeout(function() {
      if (!isAppLoaded) {
        window.location.href = webAppUrl;
      }
    }, 6000);
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8f9fa;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <iframe src="https://script.google.com/macros/s/AKfycbzl8BdqoJVL0-LtFIQkUgMmoXXGKvF-Kt4Y6ZwPV73o0Cx7hX8vHYigFtEvMIDF4lVy/exec"></iframe>

</body>
</html>
