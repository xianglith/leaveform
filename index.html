<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave View</title>
  
  <script>
    const webAppUrl = "https://script.google.com/macros/s/AKfycbzl8BdqoJVL0-LtFIQkUgMmoXXGKvF-Kt4Y6ZwPV73o0Cx7hX8vHYigFtEvMIDF4lVy/exec";

    // 1. เช็คว่าเป็น iOS (iPhone/iPad) หรือไม่ -> ถ้าใช่ Redirect ทันที
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    if (isIOS) {
      window.location.href = webAppUrl;
    }

    // 2. ตัวแปรเก็บสถานะและ Timer
    let isAppLoaded = false;
    let fallbackTimer = null;

    function cancelRedirect(reason) {
      if (!isAppLoaded) {
        isAppLoaded = true;
        if (fallbackTimer) {
          clearTimeout(fallbackTimer);
          fallbackTimer = null;
        }
        console.log("Redirect cancelled due to:", reason);
      }
    }

    // 3. ตั้งเวลาถอยหลัง 8 วินาที
    fallbackTimer = setTimeout(function() {
      if (!isAppLoaded) {
        console.log("Timeout reached. Redirecting to Web App...");
        window.location.href = webAppUrl;
      }
    }, 8000);

    // 4. ดักฟังการส่งสัญญาณข้าม Domain
    window.addEventListener("message", function(event) {
      // ยกเลิก Redirect ทันทีถ้ารับข้อความ GAS_LOADED
      if (event.data && (event.data === "GAS_LOADED" || (typeof event.data === "string" && event.data.includes("GAS_LOADED")))) {
        cancelRedirect("postMessage GAS_LOADED");
      }
    }, false);
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8f9fa;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- ใช้ onload สั่งยกเลิก Redirect ร่วมด้วย -->
  <iframe 
    src="https://script.google.com/macros/s/AKfycbzl8BdqoJVL0-LtFIQkUgMmoXXGKvF-Kt4Y6ZwPV73o0Cx7hX8vHYigFtEvMIDF4lVy/exec"
    onload="cancelRedirect('iframe onload event')">
  </iframe>

</body>
</html>
