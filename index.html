<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave View</title>
  
  <script>
    const webAppUrl = "https://script.google.com/macros/s/AKfycbzl8BdqoJVL0-LtFIQkUgMmoXXGKvF-Kt4Y6ZwPV73o0Cx7hX8vHYigFtEvMIDF4lVy/exec";

    // 1. ตรวจสอบ iOS (iPhone/iPad) -> ถ้าใช่ให้ Redirect ทันที
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    if (isIOS) {
      window.location.href = webAppUrl;
    }

    // 2. ตัวแปรเก็บ Timer เพื่อสั่งหยุด
    let fallbackTimer = null;

    // ฟังก์ชันหยุดการ Redirect ทันทีเมื่อได้รับสัญญาณ
    function stopRedirect() {
      if (fallbackTimer) {
        clearTimeout(fallbackTimer);
        fallbackTimer = null;
        console.log("GAS Loaded successfully. Redirect cancelled.");
      }
    }

    // 3. ตั้งเวลาถอยหลัง 6 วินาที (ถ้าไม่ได้รับสัญญาณจะ Redirect)
    fallbackTimer = setTimeout(function() {
      console.log("Timeout reached. Redirecting...");
      window.location.href = webAppUrl;
    }, 6000);

    // 4. ดักฟัง postMessage จาก Google Apps Script (ยืดหยุ่นขึ้น)
    window.addEventListener("message", function(event) {
      try {
        // ถ้ารับข้อความที่มีคำว่า GAS_LOADED ให้สั่งหยุด Redirect ทันที
        if (event.data && typeof event.data === "string" && event.data.indexOf("GAS_LOADED") !== -1) {
          stopRedirect();
        }
      } catch (e) {}
    }, false);
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8f9fa;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- เพิ่ม onload="stopRedirect()" สำรองไว้อีกชั้น -->
  <iframe 
    src="https://script.google.com/macros/s/AKfycbzl8BdqoJVL0-LtFIQkUgMmoXXGKvF-Kt4Y6ZwPV73o0Cx7hX8vHYigFtEvMIDF4lVy/exec"
    onload="stopRedirect()">
  </iframe>

</body>
</html>
