<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave View</title>
  
  <script>
    const webAppUrl = "https://script.google.com/macros/s/AKfycbyieHGV8i9dCLLeC11qVK4wRsmJBr_BWB0ZGBObo-zoeMu9nINHXIs_Z0xsOsFOFV1f/exec";

    // 1. เช็คว่าเป็น iPhone / iPad หรือไม่ -> ถ้าใช่ให้ Redirect ทันที
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    if (isIOS) {
      window.location.href = webAppUrl;
    }

    // 2. สำหรับ PC/Windows: ตั้งค่าเริ่มต้นว่า "ห้าม Redirect" (ไม่ใช้ Timer ถอยหลังแล้ว)
    let is401OrError = false;

    // ฟังก์ชันสั่ง Redirect เมื่อมั่นใจว่าติด 401 จริงๆ
    function redirectToApp() {
      window.location.href = webAppUrl;
    }

    // 3. ดักฟังการแจ้งเตือนจาก Apps Script
    window.addEventListener("message", function(event) {
      // ถ้า Apps Script แจ้งว่าติด 401 ให้ Redirect ทันที
      if (event.data === "NEED_REDIRECT_401") {
        redirectToApp();
      }
    }, false);
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8f9fa;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- iframe จะโหลดปกติ หากเกิด Error จากการติด 401/Blocked จะเรียก onerror สั่ง Redirect -->
  <iframe 
    src="https://script.google.com/macros/s/AKfycbyieHGV8i9dCLLeC11qVK4wRsmJBr_BWB0ZGBObo-zoeMu9nINHXIs_Z0xsOsFOFV1f/exec"
    onerror="redirectToApp()">
  </iframe>

</body>
</html>
